<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>50대 그룹 경영진 지도</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 공시 원장(ledger). 한 단, 위에 고정 도구 띠(관심 그룹·검색·테마), 표가 주인공이고 차트는 표를 돕는다.
   비교의 기준(전체·중앙값·상위 10대·관심 그룹)은 어디서나 같은 자리, 같은 모양으로 나온다. */
@font-face {
  font-family: "Pretendard Variable";
  font-weight: 45 920; font-style: normal; font-display: swap;
  src: url("fonts/PretendardVariable.woff2") format("woff2-variations"), url("fonts/PretendardVariable.woff2") format("woff2");
}
:root {
  /* 에디토리얼 리포트: 종이색 바탕, 먹 잉크, 색은 역할로만 쓴다 (review/design/DESIGN_PROPOSAL.md) */
  --bg: #faf8f5;
  --surface: #ffffff;
  --surface-2: #f3f0ea;
  --ink: #1a1a1a;
  --ink-2: #4a4a4a;
  --muted: #6b6b6b;
  --faint: #9a958d;
  --line: #e2ddd4;
  --line-2: #eeeae3;
  --rule: #1a1a1a;
  --accent: #1d4e89;          /* 선택·관심 그룹 */
  --accent-ink: #ffffff;
  --accent-soft: #e6edf6;
  --base: #8c8780;            /* 50대 전체 기준선 */
  --others: #cfcac2;          /* 나머지 그룹 */
  --mine: #fff3cc;
  --mine-line: #1d4e89;
  --seal: #b3261e;            /* 경고·감소 */
  --seal-soft: #fbeae8;
  --up: #1e7a4f;              /* 증가 */
  --ev-new: #1d4e89;
  --ev-up: #1e7a4f;
  --ev-out: #8c8780;
  --bar: #a9a399;
  --o1: #1d4e89; --o2: #d17a22; --o3: #2e8b7a; --o4: #8e5ba8; --o5: #b8463a; --o6: #7a8b3d; --o7: #8c8780; --o8: #bdb8b0;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141518; --surface: #1b1c20; --surface-2: #222328; --ink: #ece9e3; --ink-2: #c9c5be; --muted: #a29d95; --faint: #7c7870;
    --line: #2e2f33; --line-2: #26272b; --rule: #ece9e3; --accent: #7fa8e0; --accent-ink: #141518; --accent-soft: #1e2a3c;
    --base: #8c8780; --others: #4a4945; --mine: #3a3215; --mine-line: #7fa8e0;
    --seal: #f08a80; --seal-soft: #3a1f1c; --up: #5fbf8f; --ev-new: #7fa8e0; --ev-up: #5fbf8f; --ev-out: #8c8780; --bar: #6e6a63; color-scheme: dark;
    --o1: #7fa8e0; --o2: #e8a057; --o3: #5db8a6; --o4: #b58fd0; --o5: #e07a6c; --o6: #a5b868; --o7: #8c8780; --o8: #55524c;
  }
}
:root[data-theme="dark"] {
  --bg: #141518; --surface: #1b1c20; --surface-2: #222328; --ink: #ece9e3; --ink-2: #c9c5be; --muted: #a29d95; --faint: #7c7870;
  --line: #2e2f33; --line-2: #26272b; --rule: #ece9e3; --accent: #7fa8e0; --accent-ink: #141518; --accent-soft: #1e2a3c;
  --base: #8c8780; --others: #4a4945; --mine: #3a3215; --mine-line: #7fa8e0;
  --seal: #f08a80; --seal-soft: #3a1f1c; --up: #5fbf8f; --ev-new: #7fa8e0; --ev-up: #5fbf8f; --ev-out: #8c8780; --bar: #6e6a63; color-scheme: dark;
  --o1: #7fa8e0; --o2: #e8a057; --o3: #5db8a6; --o4: #b58fd0; --o5: #e07a6c; --o6: #a5b868; --o7: #8c8780; --o8: #55524c;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6;
  word-break: keep-all; overflow-wrap: anywhere; font-feature-settings: "ss06"; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }
.num, td.n, .kpi b, .chart text { font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 상단 도구 띠 ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1440px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); white-space: nowrap; }
.brand-logo { display: block; width: 28px; height: 28px; border-radius: 50%; background: #ffffff; position: relative; z-index: 1; }   /* 로고 뒤 같은 크기의 흰 원 */
/* 로고에 마우스를 올리면 주황 물결 고리가 퍼진다 */
.brand-logo-wrap { position: relative; display: block; width: 28px; height: 28px; }
.brand-logo-wrap::before, .brand-logo-wrap::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid #df7b0a; opacity: 0; pointer-events: none; }
.brand:hover .brand-logo-wrap::before, .brand:focus-visible .brand-logo-wrap::before { animation: brandRipple 1.6s cubic-bezier(.2, .6, .35, 1) infinite; }
.brand:hover .brand-logo-wrap::after, .brand:focus-visible .brand-logo-wrap::after { animation: brandRipple 1.6s cubic-bezier(.2, .6, .35, 1) .8s infinite; }
/* 글자 물결: 한 글자씩 차례로 위아래로 */
.brand .wv { display: inline-block; }
.brand .wv.sp { width: .28em; }
.brand:hover .wv, .brand:focus-visible .wv { animation: brandWave 1.4s ease-in-out calc(var(--i, 0) * 60ms) infinite; }
@keyframes brandWave { 0%, 60%, 100% { transform: translateY(0); } 20% { transform: translateY(-4px); } 40% { transform: translateY(1.5px); } }
@media (prefers-reduced-motion: reduce) { .brand:hover .wv, .brand:focus-visible .wv { animation: none; } }
@keyframes brandRipple { 0% { transform: scale(1); opacity: .75; } 100% { transform: scale(2); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .brand:hover .brand-logo-wrap::before, .brand:hover .brand-logo-wrap::after, .brand:focus-visible .brand-logo-wrap::before, .brand:focus-visible .brand-logo-wrap::after { animation: none; } }
.brand { gap: 9px; }
.brand-mark { font-weight: 850; font-size: 16px; letter-spacing: .04em; }
.brand-sep { width: 1px; height: 16px; background: var(--line); }
.brand-sub { font-weight: 650; font-size: 15px; letter-spacing: -.01em; color: var(--ink-2); }
.brand:hover { text-decoration: none; }
.nav { display: flex; gap: 2px; }
.nav a { font-size: 13.5px; color: var(--ink-2); padding: 5px 9px; border-radius: 6px; }
.nav a:hover { background: var(--surface-2); text-decoration: none; }
.tools { display: flex; gap: 8px; align-items: center; margin-left: auto; flex: 1 1 420px; justify-content: flex-end; min-width: 0; }
.mine-pick { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
select, input[type="search"] { font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); min-width: 0; }
.search { position: relative; flex: 1 1 220px; max-width: 360px; min-width: 150px; }
.search input { width: 100%; background: var(--surface-2); }
.search input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 9px; cursor: pointer; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn.theme { display: inline-grid; place-items: center; width: 36px; height: 34px; padding: 0; }
.iconbtn.theme svg { display: block; }
.ico-sun { display: none !important; }
:root[data-theme="dark"] .ico-sun { display: block !important; }
:root[data-theme="dark"] .ico-moon { display: none !important; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { --hero-a: #1c0904; --hero-b: #6e2205; --hero-c: #b1600a; } }
:root[data-theme="dark"] .hero { --hero-a: #1c0904; --hero-b: #6e2205; --hero-c: #b1600a; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .ico-sun { display: block !important; }
  :root:not([data-theme="light"]) .ico-moon { display: none !important; }
}
.results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
  box-shadow: 0 10px 28px rgba(10, 20, 40, .14); max-height: 62vh; overflow-y: auto; z-index: 8; min-width: 280px; }
.results button { display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: none; cursor: pointer; border-bottom: 1px solid var(--line-2); }
.results button:hover, .results button.on { background: var(--accent-soft); }
.results .tag { font-size: 11px; color: var(--muted); grid-row: span 2; padding-top: 2px; }
.results .sub { color: var(--muted); font-size: 12px; }

main { max-width: 1440px; margin: 0 auto; padding-block: 26px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 40px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.02em; }
h1 { font-size: clamp(25px, 3.4vw, 34px); line-height: 1.25; font-weight: 800; }
h2 { font-size: 20px; font-weight: 750; }
h3 { font-size: 15px; font-weight: 700; color: var(--ink); }
.lede { color: var(--ink-2); margin: 8px 0 0; }
.eyebrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { font-size: 12px; padding: 0 10px 0 0; margin-right: 4px; border-right: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip:last-child { border-right: 0; }
.chip b { font-weight: 650; color: var(--ink); }
.crumb { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.crumb a { color: var(--ink-2); }
.headrow { display: flex; gap: 12px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13.5px; font-weight: 550; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.band { background: var(--seal-soft); color: var(--seal); border: 1px solid color-mix(in oklab, var(--seal) 30%, transparent); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; }
.band.info { background: transparent; color: var(--ink-2); border: 0; border-left: 3px solid var(--accent); border-radius: 0; padding: 4px 12px; }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 2px solid var(--rule); }
.kpis:has(> .kpi:nth-child(5)) { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1180px) {
  .kpis:has(> .kpi:nth-child(5)) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpis:has(> .kpi:nth-child(5)) .kpi:nth-child(3n+1) { border-left: 0; padding-left: 0; }
  .kpis:has(> .kpi:nth-child(5)) .kpi:nth-child(n+4) { border-top: 1px solid var(--line); }
}
.kpi { background: transparent; padding: 14px 20px 6px; display: grid; gap: 4px; align-content: start; min-width: 0; border-left: 1px solid var(--line); }
.kpi:first-child { border-left: 0; padding-left: 0; }
.kpi > span:first-child { font-size: 12.5px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.kpi b { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.kpi b small { font-size: 16px; font-weight: 600; margin-left: 3px; color: var(--muted); }
.kpis:has(> .kpi:nth-child(5)) .kpi b { font-size: 32px; }   /* 그룹 화면처럼 칸이 많으면 숫자를 줄인다 */
.kpi b.na-big { font-size: 22px !important; color: var(--muted); font-weight: 650; line-height: 1.6; }
.kpi .cmp { font-size: 12.5px; color: var(--ink-2); }
.kpi .cmp em { font-style: normal; font-weight: 650; color: var(--ink); }
.kpi .rank { font-size: 12px; color: var(--muted); }
.strip { margin-top: 4px; }
.strip svg { display: block; width: 100%; height: 22px; }

section.panel { background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: 0; padding: 14px 0 0; min-width: 0; }
.panel-head { display: flex; gap: 8px 14px; align-items: baseline; flex-wrap: wrap; justify-content: space-between; margin-bottom: 12px; }
.panel-head p { margin: 0; color: var(--muted); font-size: 13px; flex: 1 1 260px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(max(340px, calc(50% - 20px)), 1fr)); gap: 40px; }   /* 넓은 화면에서도 한 줄에 2개까지 */
.grid2 > * { min-width: 0; }
.note { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
.finds { border-top: 2px solid var(--rule); padding-top: 14px; }
.excluded { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.excluded h3 { font-size: 13.5px; margin-bottom: 6px; }
.excluded p { margin: 4px 0; }
.excluded p b { font-weight: 600; margin-right: 6px; }
.finds-h { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0; margin-bottom: 10px; }
.finds ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 18px 32px; counter-reset: f; }
.finds li { counter-increment: f; display: flex; flex-direction: column; gap: 6px; }
.finds li::before { content: counter(f, decimal-leading-zero); font-size: 13px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.finds h3 { font-size: 16px; line-height: 1.4; }
.finds p { margin: 0; color: var(--ink-2); font-size: 14px; }
.finds a { font-size: 13px; font-weight: 600; margin-top: auto; padding-top: 4px; align-self: flex-start; }   /* 문단 길이가 달라도 링크는 같은 높이 */
/* 히어로: 첫 화면을 열면 이 구역만 보인다. 배경은 AI ROASTING 로고색(짙은 적갈 #3A1206 → 적갈 #9A3007 → 주황 #DF7B0A) 그라디언트, 안쪽 글자·선 토큰은 흰색 계열 */
.hero { --hero-a: #3a1206; --hero-b: #9a3007; --hero-c: #df7b0a; display: flex; flex-direction: column; gap: 14px; position: relative; isolation: isolate;
  min-height: calc(100svh - var(--barh, 58px)); margin-top: -26px; padding: 40px 0 30px;
  --ink: #ffffff; --ink-2: rgba(255,255,255,.86); --muted: rgba(255,255,255,.68); --faint: rgba(255,255,255,.5);
  --line: rgba(255,255,255,.22); --line-2: rgba(255,255,255,.12); --rule: rgba(255,255,255,.9); --accent: #ffffff; color: var(--ink); }
.hero::before { content: ""; position: absolute; z-index: -1; top: 0; bottom: 0; left: 50%; width: 100vw; transform: translateX(-50%);
  background: radial-gradient(1100px 520px at 85% 12%, rgba(240, 150, 40, .35), transparent 62%),
              radial-gradient(1000px 700px at 0% 100%, rgba(40, 10, 3, .62), transparent 62%),
              linear-gradient(135deg, var(--hero-a) 0%, var(--hero-b) 48%, var(--hero-c) 100%); }
.hero-copy { display: grid; gap: 14px; margin-block: auto; padding-block: 24px; }
/* 경영진 표식: AI ROASTING 로고를 원본 비율 그대로 선으로 옮긴 그림. 선 굵기는 크기와 무관하게 고정하고 불투명도로 위계를 둔다 */
.hero-mark { position: absolute; z-index: -1; right: 0; top: calc(50% - 125px); transform: translateY(-50%); width: min(27vw, 380px); height: auto; color: #ffffff; pointer-events: none; }
.hero-mark * { vector-effect: non-scaling-stroke; }
.hero-mark .mk-ring { stroke-width: 1px; stroke-opacity: .2; opacity: 0; animation: markFade 1.2s ease-out .2s forwards; }
.hero-mark .mk-human { stroke-width: 1.5px; stroke-opacity: .44; }
.hero-mark .mk-circuit { stroke-width: 1.25px; stroke-opacity: .38; }
.hero-mark .mk-human, .hero-mark .mk-circuit { stroke-dasharray: 1.02 1; stroke-dashoffset: 1.02; animation: markDraw 1.4s cubic-bezier(.22, .61, .36, 1) var(--d, 0s) forwards; }
.hero-mark .mk-pads circle { fill: currentColor; stroke: none; fill-opacity: .5; opacity: 0; animation: markFade .6s ease-out 2s forwards; }
/* 마우스를 올리면 바깥 원에서 물결이 퍼지고 연결점이 깜빡인다 */
.hero-mark { overflow: visible; }
.hero-mark .mk-ripples circle { stroke-width: 1px; stroke-opacity: 0; transform-box: view-box; transform-origin: 828px 843px; }
.hero-mark.is-hover .mk-ripples circle { animation: markRipple 2.4s cubic-bezier(.2, .6, .35, 1) infinite; }
.hero-mark.is-hover .mk-ripples circle:nth-child(2) { animation-delay: .8s; }
.hero-mark.is-hover .mk-ripples circle:nth-child(3) { animation-delay: 1.6s; }
.hero-mark.is-hover .mk-pads circle { animation: markPulse 1.6s ease-in-out infinite; }
.hero-mark.is-hover .mk-pads circle:nth-child(3n+1) { animation-delay: .25s; }
.hero-mark.is-hover .mk-pads circle:nth-child(3n+2) { animation-delay: .5s; }
.hero-mark .mk-ring { transition: stroke-opacity .4s ease; }
.hero-mark.is-hover .mk-ring { stroke-opacity: .42; }
@keyframes markRipple { 0% { transform: scale(.96); stroke-opacity: .42; } 100% { transform: scale(1.22); stroke-opacity: 0; } }
@keyframes markPulse { 0%, 100% { opacity: 1; fill-opacity: .5; } 50% { opacity: 1; fill-opacity: .95; } }
@keyframes markDraw { to { stroke-dashoffset: 0; } }
@keyframes markFade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .hero-mark .mk-human, .hero-mark .mk-circuit { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; }
  .hero-mark .mk-ring, .hero-mark .mk-pads circle { animation: none; opacity: 1; }
  .hero-mark.is-hover .mk-ripples circle, .hero-mark.is-hover .mk-pads circle { animation: none; }
}
@media (max-width: 900px) { .hero-mark { display: none; } }
.hero .scroll-cue { align-self: center; margin-top: 18px; font-size: 13px; color: var(--muted); display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.hero .scroll-cue:hover { color: var(--ink); text-decoration: none; }
.hero .scroll-cue svg { animation: cue 1.8s ease-in-out infinite; }
@keyframes cue { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
.hero h1 { font-size: clamp(28px, 3.3vw, 46px); line-height: 1.2; }
@media (min-width: 901px) { .hero h1 { white-space: nowrap; } }
.hero .lede { font-size: 16.5px; color: var(--ink-2); max-width: 78ch; }
.hero .cta { justify-self: start; margin: 4px 0 18px; background: #ffffff; border-color: #ffffff; color: #9a3007; font-weight: 700; padding: 9px 16px; }
.hero .cta:hover { filter: none; background: #fbeadb; }
.hero .chip { color: var(--muted); border-color: var(--line); }
.hero .chip b { color: var(--ink); }
.hero .kpis { border-top-color: var(--rule); }
.hero .kpi b small { color: var(--muted); }
.hero .def { color: var(--ink-2); border-color: var(--muted); }
.hero .strip svg circle, .hero .strip svg text { fill: var(--ink-2); }

function defBtn(key) { return DEF[key] ? `<button class="def" type="button" data-def="${key}" aria-label="정의 보기">i</button>` : ""; }
function bindDefs(root = document) {

      pop.style.left = `${Math.max(8, Math.min(innerWidth - p.width - 8, r.left - 20))}px`; pop.style.top = `${r.bottom + 6 + p.height > innerHeight ? r.top - p.height - 6 : r.bottom + 6}px`; };
    const hide = () => { pop.hidden = true; };
    b.addEventListener("mouseenter", show); b.addEventListener("mouseleave", hide);
    b.addEventListener("focus", show); b.addEventListener("blur", hide);
    b.addEventListener("click", e => { e.stopPropagation(); pop.hidden ? show() : hide(); });
  });
}

function diffText(m, v, ref) {

  return `전체보다 ${s} ${d > 0 ? "높습니다" : "낮습니다"}`;
}

/* ---------- 차트 ---------- */
function niceStep(v) { const p = 10 ** Math.floor(Math.log10(v)); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
function numsTable(headers, rows) {   // 차트 아래 '숫자로 보기': 마우스 없이도 값을 읽고 복사할 수 있게
  const id = uid("n");
  after(() => document.querySelector(`[data-ncopy="${id}"]`)?.addEventListener("click", async () => {
    const tsv = [headers, ...rows].map(r => r.join("\t")).join("\n") + `\n출처: DART 정기보고서·공정위 2026 지정, 50대 그룹 경영진 지도 (${ASOF()} 기준)`;
    try { await navigator.clipboard.writeText(tsv); toast("숫자를 복사했습니다."); } catch { toast("복사가 막혀 있습니다. 표를 드래그해 복사해 주세요."); }
  }));
  return `<details class="nums no-print"><summary>숫자로 보기</summary><div class="tbl" style="max-height:none;margin-top:6px"><table><thead><tr>${headers.map((h, i) => `<th class="${i ? "n" : ""}">${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i ? "n" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <button class="btn" type="button" data-ncopy="${id}" style="margin-top:6px">숫자 복사</button></details>`;
}
function niceMax(v) { if (v <= 5) return 5; const p = 10 ** Math.floor(Math.log10(v)); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }

/* 선 차트: series = [{name, values, color, dash, width}] / 반기 점은 반년 간격, 마지막 구간 점선, 속 빈 원 */
function lineChart(series, { label = "", unit = "명", fmtv = fmt, zero = true, valueLabel = true, from = 0, to = 0 } = {}) {
  const off = from ? Math.max(0, YEARS().indexOf(from)) : 0, end = to && YEARS().includes(to) ? YEARS().indexOf(to) + 1 : YEARS().length;
  if (off || end < YEARS().length) series = series.map(s => ({ ...s, values: s.values.slice(off, end) }));
  const ys = YEARS().slice(off, end), W = 560, H = 210, L = 46, R = series.some(s => s.tag) ? 120 : 46, T = 14, B = 26;   // 꼬리표가 있으면 오른쪽 여백을 넓힌다
  const all = series.flatMap(s => s.values.filter(v => v != null));
  if (!all.length) return `<p class="empty">추이를 그릴 자료가 없습니다.</p>`;
  let lo = zero ? 0 : Math.min(...all), hi = Math.max(...all);
  if (!zero) { const st = niceStep((hi - lo) / 3 || hi / 10 || 1); lo = Math.max(0, Math.floor((lo - st * 0.3) / st) * st); hi = Math.ceil((hi + st * 0.3) / st) * st; }
  const max = zero ? niceMax(hi * 1.08) : hi, min = lo;
  const x0 = xpos(ys[0]), x1 = xpos(ys[ys.length - 1]);
  const x = yr => L + (xpos(yr) - x0) / (x1 - x0) * (W - L - R);
  const y = v => T + (1 - (v - min) / (max - min)) * (H - T - B);
  const ticks = [0, .5, 1].map(f => min + (max - min) * f);
  let out = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line-2)"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${fmtv(unit === "명" ? Math.round(t) : Math.round(t * 10) / 10)}</text>`).join("");
  out += ys.map(yr => `<text x="${x(yr)}" y="${H - 7}" text-anchor="middle">${yshort(yr)}</text>`).join("");
  const labs = [];
  series.forEach((s, si) => {
    const pts = s.values.map((v, i) => [ys[i], v]).filter(p => p[1] != null);
    if (pts.length < 1) return;
    const full = pts.filter(p => !isPartial(p[0])), part = pts.filter(p => isPartial(p[0]));
    const d = full.map((p, i) => `${i ? "L" : "M"}${x(p[0])},${y(p[1])}`).join("");
    if (si === 0 && zero && full.length > 1) out += `<path d="${d}L${x(full.at(-1)[0])},${y(min)}L${x(full[0][0])},${y(min)}Z" fill="${s.color}" fill-opacity=".09"/>`;
    out += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" ${s.dash ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>`;
    if (part.length && full.length) out += `<path d="M${x(full.at(-1)[0])},${y(full.at(-1)[1])}L${x(part[0][0])},${y(part[0][1])}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" stroke-dasharray="3 3"/>`;
    const last = pts.at(-1);
    out += `<circle cx="${x(last[0])}" cy="${y(last[1])}" r="4" fill="${isPartial(last[0]) ? "var(--surface)" : s.color}" stroke="${s.color}" stroke-width="2"/>`;
    if (valueLabel && (si === 0 || series.length < 3)) labs.push({ x: x(last[0]) + 8, y: y(last[1]) + 4, t: fmtv(last[1]) + (s.tag ? ` ${s.tag}` : "") });
  });
  labs.sort((a, b) => a.y - b.y).forEach((l, i, a) => { if (i && l.y - a[i - 1].y < 13) l.y = a[i - 1].y + 13; });   // 끝 숫자가 겹치지 않게 아래로 민다
  out += labs.map(l => `<text class="lbl" x="${l.x}" y="${l.y}">${l.t}</text>`).join("");
  const band = (W - L - R) / (ys.length - 1);
  out += ys.map((yr, i) => `<rect class="hit" data-i="${i}" x="${x(yr) - band / 2}" y="${T}" width="${band}" height="${H - T - B}" fill="transparent"/>`).join("");
  out += `<line class="cross" y1="${T}" y2="${H - B}" stroke="var(--faint)" stroke-dasharray="2 3" style="display:none"/>`;
  const id = uid("l");
  after(() => {
    const el = document.getElementById(id); if (!el) return;
    const ln = el.querySelector(".cross");
    el.querySelectorAll(".hit").forEach(h => {
      const i = +h.dataset.i, yr = ys[i];
      const move = e => { ln.setAttribute("x1", x(yr)); ln.setAttribute("x2", x(yr)); ln.style.display = "";
        showTip(e, `${ylab(yr)}${isPartial(yr) ? " (반기)" : ""}<br>` + series.map(s => `<span style="color:${s.color === "var(--faint)" ? "inherit" : "inherit"}">${esc(s.name)}</span> <b>${s.values[i] == null ? "–" : fmtv(s.values[i])}${unit === "명" ? "명" : ""}</b>`).join("<br>")); };
      h.addEventListener("mousemove", move); h.addEventListener("mouseleave", () => { ln.style.display = "none"; hideTip(); });
    });
  });
  const leg = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i class="${s.dash ? "dash" : "line"}" style="border-color:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  const nums = numsTable(["시점", ...series.map(s => s.name)], ys.map((yr, i) => [ylab(yr), ...series.map(s => s.values[i] == null ? "–" : fmtv(s.values[i]))]).filter(r => r.slice(1).some(v => v !== "–")));
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${out}</svg>${leg}${nums}</div>`;
}

/* 신규·승진(0선 위) / 이탈(0선 아래) 발산형 막대 + 순증 선. 직급 비공개가 크면 승진은 빗금(집계 불가) */
function flowChart(ev, heads, { hidden = null, partialUp = false } = {}) {
  const ys = YEARS().filter(y => y > YEARS()[0] && y <= FLOW_END());
  const idx = ys.map(y => YEARS().indexOf(y));
  const nw = idx.map(i => ev["신규"][i] || 0), up = idx.map(i => ev["승진"][i] || 0), ot = idx.map(i => ev["이탈"][i] || 0);
  const noUpY = idx.map(i => hidden ? (hidden[i] || 0) >= 30 : false);   // 그해 직급 비공개가 30% 이상이면 승진을 셀 수 없다
  const anyNoUp = noUpY.some(Boolean);
  const top = niceMax(Math.max(1, ...nw.map((v, j) => Math.max(v, noUpY[j] ? 0 : up[j])))), bot = niceMax(Math.max(1, ...ot));
  const W = 560, H = 230, L = 46, R = 10, T = 12, B = 26;
  const y0 = T + (H - T - B) * top / (top + bot);
  const sy = v => (H - T - B) * v / (top + bot);
  const band = (W - L - R) / ys.length, bw = Math.min(16, (band - 12) / 2);
  const hatchId = uid("h");
  let out = `<defs><pattern id="${hatchId}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--faint)" stroke-width="2"/></pattern></defs>`;
  out += `<line x1="${L}" x2="${W - R}" y1="${T}" y2="${T}" stroke="var(--line-2)"/><text x="${L - 8}" y="${T + 4}" text-anchor="end">${fmt(top)}</text>`;
  out += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line-2)"/><text x="${L - 8}" y="${H - B + 4}" text-anchor="end">−${fmt(bot)}</text>`;
  out += `<line x1="${L}" x2="${W - R}" y1="${y0}" y2="${y0}" stroke="var(--line)"/><text x="${L - 8}" y="${y0 + 4}" text-anchor="end">0</text>`;
  const net = [];
  ys.forEach((yr, j) => {
    const cx = L + band * j + band / 2, xa = cx - bw - 1, xb = cx + 1;
    if (noUpY[j]) out += `<rect x="${cx - band / 2 + 2}" y="${T}" width="${band - 4}" height="${H - T - B}" fill="url(#${hatchId})" opacity=".35"/>`;
    out += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${yshort(yr)}</text>`;
    const rUp = (xx, h, fill) => h <= 0 ? "" : `<path d="M${xx},${y0}V${y0 - h + Math.min(3, h)}Q${xx},${y0 - h} ${xx + Math.min(3, h)},${y0 - h}H${xx + bw - Math.min(3, h)}Q${xx + bw},${y0 - h} ${xx + bw},${y0 - h + Math.min(3, h)}V${y0}Z" fill="${fill}"/>`;
    out += rUp(xa, sy(nw[j]), "var(--ev-new)");
    if (!noUpY[j]) out += rUp(xb, sy(up[j]), "var(--ev-up)");
    const ho = sy(ot[j]);
    const xo = cx - bw / 2;   // 이탈 막대도 신규·승진과 같은 폭, 가운데 정렬
    if (ho > 0) out += `<path d="M${xo},${y0}V${y0 + ho - Math.min(3, ho)}Q${xo},${y0 + ho} ${xo + Math.min(3, ho)},${y0 + ho}H${xo + bw - Math.min(3, ho)}Q${xo + bw},${y0 + ho} ${xo + bw},${y0 + ho - Math.min(3, ho)}V${y0}Z" fill="var(--ev-out)" fill-opacity=".75"/>`;
    net.push([cx, y0 - sy(nw[j] - ot[j])]);
    out += `<rect class="hit" data-j="${j}" x="${cx - band / 2}" y="${T}" width="${band}" height="${H - T - B}" fill="transparent"/>`;
  });
  out += `<path d="${net.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join("")}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-opacity=".7"/>` + net.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--ink)" fill-opacity=".8"/>`).join("");
  const id = uid("f");

function ageHist(hist) {
  const bins = [35, 40, 45, 50, 55, 60, 65, 70], W = 560, H = 180, L = 40, R = 8, T = 14, B = 26;
  const v = bins.map(b => hist?.[b] || 0), tot = sum(v);
  if (!tot) return `<p class="empty">자료가 없습니다.</p>`;
  const max = niceMax(Math.max(...v)), band = (W - L - R) / bins.length, y = n => T + (1 - n / max) * (H - T - B);
  let out = [0, .5, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--line-2)"/><text x="${L - 8}" y="${y(max * f) + 4}" text-anchor="end">${fmt(max * f)}</text>`).join("");
  bins.forEach((b, i) => {
    const bx = L + band * i + 1, bw = band - 2, top = y(v[i]), h = y(0) - top, r = Math.min(3, h);
    const lab = b === 35 ? "39세 이하" : b === 70 ? "70세 이상" : `${b}–${b + 4}`;
    out += `<path d="M${bx},${y(0)}V${top + r}Q${bx},${top} ${bx + r},${top}H${bx + bw - r}Q${bx + bw},${top} ${bx + bw},${top + r}V${y(0)}Z" fill="var(--bar)"/>
      ${v[i] ? `<text x="${bx + bw / 2}" y="${top - 4}" text-anchor="middle" class="lbl" style="font-size:10.5px">${(100 * v[i] / tot).toFixed(0)}%</text>` : ""}
      <text x="${bx + bw / 2}" y="${H - 8}" text-anchor="middle">${lab}</text>
      <rect class="hit" data-i="${i}" data-l="${lab}" x="${bx}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/>`;
  });
  const id = uid("a");
  after(() => { const el = document.getElementById(id); if (!el) return;
    el.querySelectorAll(".hit").forEach(h => { h.addEventListener("mousemove", e => { const i = +h.dataset.i; showTip(e, `${h.dataset.l} <b>${fmt(v[i])}명</b> (${(100 * v[i] / tot).toFixed(1)}%)`); }); h.addEventListener("mouseleave", hideTip); }); });
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="나이 분포">${out}</svg></div>`;
}

/* ---------- 표: 정렬(키보드), 고정 기준 행, 열 그룹, 표본 작음 아래로, 복사·CSV ---------- */
function table({ cols, rows, pinned = [], key, dir = -1, href, rowClass, groupsHdr, title = "표", note = "", stickyFirst = true, countLabel, limit = 0, moreAll = false, unit = "명", sep = 0, inPlaceKey = null }) {
  const id = uid("t");
  let k = key === null ? null : (key || cols[0].k), d = dir, lim = limit, lastSorted = rows;
  const val = (c, r) => c.v ? c.v(r) : r[c.k];
  const draw = () => {
    const el = document.getElementById(id); if (!el) return;
    const c = cols.find(c => c.k === k);
    const sorted = !c ? rows.slice() : rows.slice().sort((a, b) => {   // key가 없으면 넘겨받은 순서를 지킨다
      const sa = a._bottom ? 1 : 0, sb = b._bottom ? 1 : 0; if (sa !== sb && c.k !== inPlaceKey) return sa - sb;   // 표본 작음·공시 없음은 아래로(자산 순위 정렬이면 제자리)
      const va = val(c, a), vb = val(c, b);

    const vis = lim ? sorted.slice(0, lim) : sorted;
    const head = (groupsHdr ? `<tr class="grp">${groupsHdr.map(g => `<th colspan="${g.span}" class="${g.cls || ""}">${g.t}</th>`).join("")}</tr>` : "") +
      "<tr>" + cols.map((c, i) => `<th class="${c.n ? "n" : ""} ${c.gl ? "gl" : ""} ${i === 0 && stickyFirst ? "sticky" : ""}" scope="col" ${c.k === k ? `aria-sort="${d > 0 ? "ascending" : "descending"}"` : ""}>
        ${c.nosort ? c.t : `<button class="sortb" data-k="${c.k}" type="button">${c.t}</button>`}${c.def ? " " + defBtn(c.def) : ""}</th>`).join("") + "</tr>";
    const rowHtml = (r, cls, h) => `<tr class="${cls}" ${h ? `data-href="${h}"` : ""}>` + cols.map((c, i) => `<td class="${c.n ? "n" : ""} ${c.gl ? "gl" : ""} ${c.cls || ""} ${i === 0 && stickyFirst ? "sticky" : ""}">${r._span && i === 1 ? `<span>${r._span}</span>` : r._span && i > 1 ? "" : (c.f ? c.f(r) : esc(val(c, r)))}</td>`).join("") + "</tr>";
    el.querySelector("thead").innerHTML = head;
    el.querySelector("tbody").innerHTML = pinned.map((r, i) => rowHtml(r, `ref ${r._mine ? "mine" : ""} ${i === pinned.length - 1 ? "last" : ""}`, r._href)).join("") +
      vis.map((r, i) => rowHtml(r, (sep && i % sep === sep - 1 && i < vis.length - 1 ? "sep " : "") + (rowClass ? rowClass(r) : "") + (href && href(r) ? " go" : ""), href ? href(r) : null)).join("");
    el.querySelectorAll("button.sortb").forEach(b => b.addEventListener("click", () => {
      const nk = b.dataset.k; d = nk === k ? -d : (cols.find(c => c.k === nk).n ? -1 : 1); k = nk; draw();
      el.querySelector(`button.sortb[data-k="${nk}"]`)?.focus();

    el.querySelectorAll("tr[data-href]").forEach(tr => {

      tr.addEventListener("click", e => { if (!e.target.closest("a,button")) go(); });

      }

  const exportRows = () => {

    const body = [...pinned, ...lastSorted].map(r => cols.map(c => r._span && c !== cols[0] && c !== cols[1] ? "" : (c.xv ? c.xv(r) : (r._span && c === cols[1] ? r._spanText : (val(c, r) ?? "")))));

  const tools = `<div class="tblbar"><div class="left">${countLabel ? `<span class="count">${countLabel}</span>` : ""}</div>
    <div class="actions"><button class="btn" type="button" data-copy="${id}">표 복사</button><button class="btn" type="button" data-csv="${id}">CSV 내려받기</button></div></div>`;
  after(() => {

    });
    document.querySelector(`[data-csv="${id}"]`)?.addEventListener("click", () => {
      const csv = "﻿" + [[title], [`기준: 명단 ${ASOF()} · 흐름 ${M().flow[0]}–${M().flow[1]} · 보수 ${M().pay_year} · 출처 DART 정기보고서, 공정위 2026 지정`], ...exportRows()]

        toast("CSV를 내려받습니다. 내려받기가 막힌 화면이면 ‘표 복사’를 써 주세요.");
      } catch { toast("내려받기가 막혀 있습니다. ‘표 복사’를 써 주세요."); }
    });
  });
  return `${tools}<div class="tbl"><table id="${id}"><thead></thead><tbody></tbody></table></div>${limit ? `<p id="${id}-more"></p>` : ""}${note ? `<p class="note">${note}</p>` : ""}`;
}

  const cards = [
    { h: `여성 경영진 비율은 그룹마다 크게 다릅니다`, b: `${esc(fem[0].name)} ${pct(fem[0].v.female)}, ${esc(fem[1].name)} ${pct(fem[1].v.female)}가 높고 ${esc(fem.at(-1).name)} ${pct(fem.at(-1).v.female)}가 가장 낮습니다(경영진 ${M().min_n}명 이상 그룹). 50대 전체는 ${pct(B.female.all)}.`, to: `g${fem[0].rank}`, tl: `${esc(fem[0].name)} 보기` },
    (() => { const a = T.new_rate[i0], b = T.new_rate[i1], dir = b < a - 0.5 ? ["줄었습니다", "내려갔습니다"] : b > a + 0.5 ? ["늘었습니다", "올라갔습니다"] : ["비슷합니다", "움직였습니다"];
      return { h: `새로 선임되는 임원 비율이 ${dir[0]}`, b: `연간 신규율이 ${M().flow[0]}년 ${pct(a)}에서 ${FLOW_END()}년 ${pct(b)}로 ${dir[1]}. 신규율은 그해 신규 선임 ÷ 전년 말 경영진입니다.`, to: "cmp-flow", tl: "그룹별 인사 흐름 보기" }; })(),
    { h: `사외이사는 관료·법조·학계 출신이 많습니다`, b: `사외이사 ${fmt(T.out.n)}명 중 관료·법조 ${pct(B.out_gov.all)}, 학계 ${pct(B.out_acad.all)}입니다(공시 경력 규칙 분류).`, to: "cmp-board", tl: "그룹별 이사회 보기" },

    <section class="panel"><div class="panel-head"><h3>경영진 수 (연말 기준, 2026년은 반기 말)</h3></div>${lineChart([{ name: "경영진", values: g.heads, color: "var(--accent)" }], { label: "경영진 수", zero: false })}<p class="note">축이 0에서 시작하지 않습니다. 변화를 보려고 범위를 좁혔습니다.</p></section>

      ${compareBars([{ k: "외부 경력 있음", v: h.n ? 100 * h.ext / h.n : null, ref: T.hire.n ? 100 * T.hire.ext / T.hire.n : null }, { k: "그룹 내부", v: h.n ? 100 * h.int / h.n : null, ref: T.hire.n ? 100 * T.hire.int / T.hire.n : null }, { k: "판단 불가", v: h.n ? 100 * h.unk / h.n : null, ref: T.hire.n ? 100 * T.hire.unk / T.hire.n : null }], { refName: "50대 전체" })}

/* 직급별 인원·평균 나이(그룹 vs 50대 전체 같은 직급), 상무 → 첫 승진 소요 연수 */
function rankAgeTable(g) {
  const ra = g.rank_age || [];
  if (!ra.length) return "";
  const all = {};
  CORE.groups.filter(x => x.has_data).forEach(x => (x.rank_age || []).forEach(r => { (all[r.rank] ||= [0, 0]); all[r.rank][0] += r.n; all[r.rank][1] += r.n * r.avg; }));
  const pr = g.promo, PA = M().promo_all, hiddenNow = (g.v.rank_hidden || 0) >= 30;
  return `<div class="tbl" style="margin-top:12px;max-height:none"><table><thead><tr><th>직급</th><th class="n">인원</th><th class="n">비율</th><th class="n">평균 나이</th><th class="n">최연소</th><th class="n">50대 전체 평균 나이</th></tr></thead><tbody>
    ${ra.map(r => `<tr><td>${esc(r.rank)}</td><td class="n">${fmt(r.n)}</td><td class="n">${(100 * r.n / g.k.n).toFixed(1)}%</td><td class="n">${r.n >= 5 ? f1(r.avg) : `<span class="na">${f1(r.avg)}</span>`}</td><td class="n">${r.min}</td><td class="n">${all[r.rank] ? f1(all[r.rank][1] / all[r.rank][0]) : "–"}</td></tr>`).join("")}</tbody></table></div>
    <p class="note"><b>상무 승진 속도</b> ${hiddenNow ? "직급 비공개 비중이 커서 집계할 수 없습니다." : pr && pr.cohort_pct != null ? `2019–2021년 상무로 처음 공시된 ${fmt(pr.cohort_n)}명 중 4년 안에 한 직급 이상 오른 사람 ${fmt(pr.cohort_up)}명(${pct(pr.cohort_pct)}). 50대 전체 ${pct(PA.cohort_pct)}(${fmt(PA.cohort_n)}명).` : `2019–2021년 신규 상무가 20명 미만이라 비율을 산출하지 않습니다.`} 모두 4년을 지켜본 같은 기간 코호트라 그룹끼리 비교할 수 있습니다. 직급 체계 개편에 따른 직위 변화는 승진으로 집계하지 않습니다.</p>`;
}
/* 사외이사 과반·여성 이사: 법정 요건 대상(자산 2조 원 이상 비금융 상장사)만 센다 */
function boardMandate(g) {
  const bx = g.boardx || {};
  if (!bx.n_mand) return `<p class="note">자산 2조 원 이상 비금융 상장사(사외이사 과반·이사회 성별 요건 대상)가 없습니다.</p>`;
  const nm = id => { const c = byId[id]; return c ? `<a href="#c${c.id}">${esc(c.name)}</a>` : ""; };
  return `<p class="note" style="margin-top:12px"><b>법정 요건 대상 ${bx.n_mand}곳</b>(자산 2조 원 이상 비금융 상장사, ${M().pay_year}년 말 별도 기준): 사외이사 과반 ${bx.major_n}곳, 여성 등기이사 있음 ${bx.fem_n}곳.
    ${bx.no_major?.length ? `<br>사외이사가 과반이 아닌 곳: ${bx.no_major.map(nm).join(", ")}` : ""}${bx.no_fem?.length ? `<br>${ASOF()} 명단에 여성 등기이사가 없는 곳: ${bx.no_fem.map(nm).join(", ")}` : ""}
    ${bx.no_major?.length || bx.no_fem?.length ? `<br><span class="na">공시 명단 기준 집계입니다. 선임 시점과 공시 시점의 차이가 있을 수 있어 원문으로 확인해 주세요.</span>` : ""}</p>`;
}

/* ---------- 화면: 보고서 한 장 (#r4 또는 #r4x1x2x3: 비교 그룹 최대 3개) ---------- */
const PEER_COLORS = ["#c25b43", "#8e5bb5", "#4f8a87"];
function viewReport(rank, peers = []) {

  const ms = ["executives", "avg_age", "female", "b80", "new_rate", "exit_rate", "new_age", "ext_hire", "out_ratio", "out_female", "out_gov", "out_acad", "grad", "pay"];
  const cell = (x, m) => { const v = x.small && MET[m].rate ? null : x.v[m]; return v == null ? (coverage(m, x) ? `근거 부족<span class="cov">${esc(coverage(m, x))}</span>` : "–") : MET[m].f(v); };
  const rows = ms.map(m => ({ m, t: MET[m].t, time: timeLabel(MET[m].time), rank: g.rank_of?.[m], n: B[m].n }));
  const cols = [
    { k: "t", t: "지표", cls: "name", f: r => `${esc(r.t)} ${defBtn(r.m)}`, xv: r => r.t },
    { k: "time", t: "기준", f: r => `<span class="na" style="white-space:nowrap">${esc(MET[r.m].time === "now" ? `${ASOF()}` : MET[r.m].time === "flow" ? `${M().flow[0]}–${M().flow[1]} 평균` : `${M().pay_year} 연간`)}</span>`, xv: r => r.time },
    { k: "g", t: esc(g.name), n: 1, gl: 1, f: r => `<b>${cell(g, r.m)}</b>`, xv: r => cell(g, r.m) },
    ...peers.map(pg => ({ k: "p" + pg.rank, t: esc(pg.name), n: 1, f: r => cell(pg, r.m), xv: r => cell(pg, r.m) })),
    { k: "all", t: "50대 전체", n: 1, gl: 1, f: r => B[r.m].all == null ? "–" : MET[r.m].f(B[r.m].all), xv: r => B[r.m].all ?? "" },
    { k: "med", t: "중앙값", n: 1, f: r => B[r.m].median == null ? "–" : MET[r.m].f(B[r.m].median), xv: r => B[r.m].median ?? "" },
    { k: "top", t: "상위 10대 평균", n: 1, f: r => B[r.m].top10 == null ? "–" : MET[r.m].f(B[r.m].top10), xv: r => B[r.m].top10 ?? "" },
    { k: "rank", t: "순위", n: 1, gl: 1, f: r => r.rank ? `${rankText(r.rank, r.n)}<span class="na"> / ${r.n}</span>` : "–", xv: r => r.rank ? `${r.rank}/${r.n}` : "" },
  ];
  const yi = y => YEARS().indexOf(+y);
  const y0 = +M().flow[0], y1 = FLOW_END();
  const a0 = g.new_rate[yi(y0)], a1 = g.new_rate[yi(y1)], t0 = T.new_rate[yi(y0)], t1 = T.new_rate[yi(y1)];
  const trend = (x0, x1) => x1 > x0 ? "올랐습니다" : x1 < x0 ? "내려갔습니다" : "같습니다";
  const lines = [
    `경영진 ${fmt(g.v.executives)}명, 평균 ${f1(g.v.avg_age)}세(전체 ${f1(B.avg_age.all)}세), 여성 ${pct(g.v.female)}(전체 ${pct(B.female.all)}).`,
    `${y0}–${y1} 연평균 신규율 ${pct(g.v.new_rate)}로 전체 ${pct(B.new_rate.all)}${g.rank_of?.new_rate ? `, ${B.new_rate.n}개 그룹 중 ${rankText(g.rank_of.new_rate, B.new_rate.n)}` : ""}. ${y0}년 ${pct(a0)}에서 ${y1}년 ${pct(a1)}로 ${trend(a0, a1)}(같은 기간 전체 ${pct(t0)} → ${pct(t1)}, ${y1}년 격차 ${a1 != null && t1 != null ? `${(a1 - t1 > 0 ? "+" : "")}${(a1 - t1).toFixed(1)}%p` : "–"}).`,
    `이사회 중 사외이사 ${pct(g.v.out_ratio)}, 사외이사 ${fmt(g.out.n)}명 중 여성 ${pct(g.out.female)}(전체 ${pct(B.out_female.all)}), 관료·법조 출신 ${pct(g.v.out_gov)}(전체 ${pct(B.out_gov.all)}).`,
  ];
  const peerSel = i => `<select data-peer="${i}" aria-label="비교 그룹 ${i + 1}"><option value="">비교 그룹 ${i + 1}</option>${CORE.groups.filter(x => x.has_data && x.rank !== rank).map(x => `<option value="${x.rank}" ${peers[i]?.rank === x.rank ? "selected" : ""}>${x.rank}. ${esc(x.name)}</option>`).join("")}</select>`;
  const series = [{ name: g.name, values: g.new_rate, color: "var(--accent)", width: 2.5 }, ...peers.map((pg, i) => ({ name: pg.name, values: pg.new_rate, color: PEER_COLORS[i], width: 1.5 })), { name: "50대 그룹 전체", values: T.new_rate, color: "var(--faint)", dash: true }];

      <h1>${esc(g.name)} 경영진, 상위 50개 그룹과 견주면</h1>
      <ul class="lede" style="padding-left:18px;margin-top:10px;display:grid;gap:4px">${lines.map(l => `<li>${l}</li>`).join("")}</ul></div>

      <div><h3 style="margin-bottom:6px">연도별 신규율</h3>${lineChart(series, { unit: "%", fmtv: v => `${(+v).toFixed(1)}%`, from: +M().flow[0], to: FLOW_END() })}</div>
      <div><h3 style="margin-bottom:6px">사외이사 출신 (${fmt(g.out.n)}명)</h3>${originStack(g.out.origin, g.out.n)}</div>
    </div>
    <div class="foot"><div>정의: 경영진 = 사내이사 + 미등기 임원 + 집행임원(그룹 안 겸직 1명). 신규율 = 해마다 신규 선임 ÷ 전년 말 경영진의 평균. 전체 = 모든 그룹 경영진을 합산한 값, 중앙값·순위 = 경영진 ${M().min_n}명 이상 그룹.</div>

function bindRoster(compIdx, years, title) {

  [yrSel, evf, fnf].forEach(s => s.addEventListener("change", () => draw())); flt.addEventListener("input", () => draw());
  function draw() {
    if (!PEOPLE) return;
    const yr = +yrSel.value, q = flt.value.trim().toLowerCase(), ef = evf.value, ff = fnf.value;
    const firstObs = {};
    compIdx.forEach(ci => { const c = compAt(ci); firstObs[ci] = YEARS().find((_, i) => c.heads[i] != null); });
    let rows = [];
    compIdx.forEach(ci => (personByCompany.get(ci) || []).forEach(([p, r]) => {
      if (r[0] !== yr) return;
      const here = p[5].filter(x => x[1] === ci).map(x => x[0]), first = Math.min(...here);
      const evs = (evIndex.get(`${p[0]}|${yr}|${ci}`) || []).map(e => EVN()[e[1]]);

      const nextOut = ny ? (evIndex.get(`${p[0]}|${ny}|${ci}`) || []).some(e => EVN()[e[1]] === "이탈") : false;
      rows.push({ p, r, ci, first, censored: first === firstObs[ci], evs, nextOut });
    }));
    rows = rows.filter(x => who === "all" ? true : who === "exec" ? EXEC_REG.has(x.r[2]) : !EXEC_REG.has(x.r[2]) || x.r[2] === 1);
    if (ef === "nextout") rows = rows.filter(x => x.nextOut); else if (ef) rows = rows.filter(x => x.evs.includes(ef));
    if (ff) rows = rows.filter(x => M().funcs[x.r[6]] === ff);
    if (q) rows = rows.filter(x => (x.p[1] + " " + x.r[3] + " " + x.r[5]).toLowerCase().includes(q));
    const multi = compIdx.length > 1;

      ...(multi ? [{ k: "co", t: "회사", cls: "nw", v: x => compAt(x.ci).name, f: x => `<a href="#c${compAt(x.ci).id}">${esc(compAt(x.ci).name)}</a>`, xv: x => compAt(x.ci).name }] : []),
      { k: "reg", t: "구분", v: x => x.r[2], f: x => `<span class="pill ${x.r[2] === 0 ? "" : "reg"}">${esc(PEOPLE.reg[x.r[2]])}</span>`, xv: x => PEOPLE.reg[x.r[2]] },
      { k: "pos", t: "직위", cls: "nw", v: x => PEOPLE.ranks.length - x.r[4], f: x => esc(x.r[3]), xv: x => x.r[3] },
      { k: "age", t: "나이", n: 1, v: x => yr - +x.p[2].slice(0, 4), f: x => yr - +x.p[2].slice(0, 4), xv: x => yr - +x.p[2].slice(0, 4) },
      { k: "birth", t: "출생", cls: "nw", v: x => x.p[2], f: x => `<span class="num">${esc(x.p[2].replace("-", "."))}</span>`, xv: x => x.p[2].replace("-", ".") },
      { k: "fn", t: "기능", v: x => M().funcs[x.r[6]], f: x => `<span class="pill">${esc(M().funcs[x.r[6]])}</span>`, xv: x => M().funcs[x.r[6]] },
      { k: "duty", t: "담당 업무", cls: "wrap", v: x => x.r[5], f: x => esc(x.r[5]), xv: x => x.r[5] },
      { k: "ev", t: "인사 변동", v: x => x.evs.join(","), f: x => x.evs.filter(e => !["직급체계변경"].includes(e)).map(e => `<span class="ev ${e === "신규" ? "new" : e === "승진" ? "up" : ""}">${esc(evLabel(e))}</span>`).join(" ") + (x.nextOut ? ` <span class="ev out">다음 해 빠짐</span>` : ""), xv: x => x.evs.join("|") + (x.nextOut ? "|다음해빠짐" : "") },

      { k: "first", t: "첫 공시", n: 1, v: x => x.first, f: x => x.censored ? `${x.first} 이전부터` : `${x.first}`, xv: x => x.censored ? `${x.first} 이전부터` : `${x.first}` },
    ];
    $("#roster").innerHTML = rows.length
      ? table({ cols, rows, limit: 300, key: "pos", dir: -1, href: x => `p${x.p[0]}`, title: `${title}_${yr}_명단`, countLabel: `${fmt(rows.length)}명 · 명단 기준일 ${[...new Set(compIdx.map(ci => compAt(ci).asof?.[yr]).filter(Boolean))].join(", ").replace(/-/g, ".") || ylab(yr)}${compIdx.some(ci => compAt(ci).asof_odd?.includes(String(yr))) ? " (보고서 제출일 기준으로 적힌 명단 포함)" : ""}`,
        note: "출신 태그를 누르면 판정 근거 문구가 표시됩니다. 첫 공시가 ‘이전부터’면 그 회사가 처음 공시된 해에 이미 있던 사람이라 실제 취임은 더 이를 수 있습니다. 나이는 기준 연도 − 출생연도라 만 나이와 최대 1세 차이가 납니다. 출생은 공시된 연월입니다." })
      : `<p class="empty">조건에 맞는 사람이 없습니다. 연도나 필터를 바꿔 보세요.</p>`;
  }
  draw();
  loadPeople().then(draw).catch(() => { $("#roster").innerHTML = `<p class="empty">인물 명단을 불러오지 못했습니다. 새로고침해 주세요.</p>`; });
}

      <div class="crumb"><a href="#home">50대 그룹</a><span>›</span>${g ? `<a href="#g${g.rank}">${esc(g.name)}</a><span>›</span>` : ""}${lc ? `<a href="#c${lc.id}">${esc(lc.name)}</a>` : ""}</div>
      <h1>${esc(p[1])}</h1>
      <p class="lede">${lc ? esc(lc.name) : ""} ${esc(last[3])} <span class="na">(${ylab(last[0])} 공시)</span></p>
      <p style="margin:8px 0 0">${esc(summaryLine)}</p>
      <p class="note">아래 내용은 공시 원문에 적힌 그대로입니다. 출신·기능·학력 태그는 공시 문구에 규칙을 적용한 추정입니다.${M().contact ? ` 공시와 다르거나 다른 사람과 합쳐진 기록을 보시면 ${esc(M().contact)}로 알려 주세요.` : ""}</p>
    </div>
    <div class="kpis">
      <div class="kpi"><span>공시된 해</span><b>${new Set(rows.map(r => r[0])).size}<small>번</small></b><span class="cmp">${first}${first === YEARS()[0] || first === firstObs ? "년 이전부터" : "년"} ~ ${ylab(last[0])}</span></div>
      <div class="kpi"><span>거친 회사</span><b>${new Set(rows.map(r => r[1])).size}<small>곳</small></b><span class="cmp">${esc([...new Set(rows.map(r => compAt(r[1])?.name).filter(Boolean))].join(", "))}</span></div>
      <div class="kpi"><span>직위 변화</span><b>${Math.max(0, posPath.length - 1)}<small>회</small></b><span class="cmp">${esc(posPath.join(" → "))}</span></div>
      <div class="kpi"><span>출신(추정)</span><b style="font-size:20px">${esc(PEOPLE.origins[p[9]])}</b><span class="cmp">${p[10] ? `근거: ${esc(p[10].split("|").join(", "))}` : "판정 근거 문구 없음"}</span></div>
    </div>
    <div class="grid2">
      <section class="panel"><div class="panel-head"><h3>연도별 경력</h3></div><div class="timeline">${tl}</div></section>
      <section class="panel"><div class="panel-head"><h3>최근 공시의 주요 경력</h3></div>
        ${lines.length ? `<ul class="career">${lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : `<p class="empty">공시된 경력이 없습니다.</p>`}
        <dl class="facts" style="margin-top:14px">
          <dt>출생</dt><dd>${esc(p[2].replace("-", "년 "))}월</dd>
          <dt>학력</dt><dd>${p[8] ? esc(p[8]) : PEOPLE.degrees[edu[0]] ? `${esc(PEOPLE.degrees[edu[0]])}${PEOPLE.fields[edu[1]] ? ` · ${esc(PEOPLE.fields[edu[1]])}` : ""}${edu[2] ? " · 해외 학위" : ""}${edu[3] ? ` · ${esc(edu[3].split("|").join(", "))}` : ""} <span class="na">(경력 문구에서 추정)</span>` : "공시 없음"}</dd>
        </dl></section>
    </div>`;
    app.querySelectorAll("[data-cite]").forEach(b => b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(b.dataset.cite); toast("인용 문구를 복사했습니다."); } catch { toast(b.dataset.cite); }
    }));
  }).catch(() => { app.innerHTML = `<p class="empty">인물 명단을 불러오지 못했습니다. 새로고침해 주세요.</p>`; });
}

/* ---------- 검색 ---------- */
const q = $("#q"), results = $("#results");
let sel = -1, items = [];
function runSearch() {
  const s = q.value.trim();
  if (!s) { results.hidden = true; q.setAttribute("aria-expanded", "false"); return; }
  q.setAttribute("aria-expanded", "true");
  const low = s.toLowerCase();
  items = [];
  CORE.groups.filter(g => g.name.toLowerCase().includes(low)).slice(0, 4).forEach(g => items.push({ tag: "그룹", t: g.name, sub: g.has_data ? `${g.rank}위 · 공시 회사 ${g.companies.length}곳` : `${g.rank}위 · 임원 공시 없음`, h: `g${g.rank}` }));
  CORE.companies.filter(c => c.name.toLowerCase().includes(low)).slice(0, 6).forEach(c => items.push({ tag: "회사", t: c.name, sub: c.group, h: `c${c.id}` }));
  if (PEOPLE && s.length >= 2) PEOPLE.people.filter(p => p[1].toLowerCase().includes(low)).slice(0, 30).forEach(p => {
    const r = p[5].at(-1), c = compAt(r[1]); items.push({ tag: "인물", t: p[1], sub: `${p[2].slice(0, 4)}년생 · ${yshort(r[0])} ${c ? c.name : ""} ${r[3]}`, h: `p${p[0]}` });
  });
  const wait = !PEOPLE && s.length >= 2 ? `<div class="loading" style="padding:8px 12px">인물 명단을 불러오고 있습니다. 잠시 후 결과가 이어서 표시됩니다.</div>` : "";
  results.innerHTML = items.length || wait ? items.map((it, i) => `<button role="option" type="button" data-i="${i}" class="${i === sel ? "on" : ""}" aria-selected="${i === sel}"><span class="tag">${it.tag}</span><span>${esc(it.t)}</span><span class="sub">${esc(it.sub)}</span></button>`).join("") + wait
    : `<div class="empty" style="padding:10px 12px">‘${esc(s)}’에 맞는 결과가 없습니다.</div>`;
  results.hidden = false;
  results.querySelectorAll("button").forEach(b => b.addEventListener("mousedown", e => { e.preventDefault(); go(+b.dataset.i); }));
}
function go(i) { const it = items[i]; if (!it) return; location.hash = it.h; q.value = ""; results.hidden = true; q.blur(); }
q.addEventListener("focus", () => { loadPeople().then(() => { if (q.value) runSearch(); }).catch(() => {}); });
q.addEventListener("input", () => { sel = -1; runSearch(); });
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { sel = Math.min(items.length - 1, sel + 1); runSearch(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); runSearch(); e.preventDefault(); }
  else if (e.key === "Enter") go(sel >= 0 ? sel : 0);
  else if (e.key === "Escape") { results.hidden = true; q.blur(); }
});
q.addEventListener("blur", () => setTimeout(() => { results.hidden = true; }, 120));

/* ---------- 관심 그룹, 테마 ---------- */
function syncMine() {
  const s = $("#mine"), me = mineRank();
  s.innerHTML = `<option value="">관심 그룹 고르기</option>` + CORE.groups.filter(g => g.has_data).map(g => `<option value="${g.rank}" ${g.rank === me ? "selected" : ""}>${g.rank}. ${esc(g.name)}</option>`).join("");
}
$("#mine").addEventListener("change", e => { store.set("mineGroup", e.target.value || null); route(true); });
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  const dark = (t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark", lab = dark ? "밝게 보기" : "어둡게 보기";
  const b = $("#theme"); if (b) { b.setAttribute("aria-label", lab); b.title = lab; }
}
applyTheme(store.get("theme"));
const setBarH = () => document.documentElement.style.setProperty("--barh", `${document.querySelector(".bar")?.offsetHeight || 58}px`);
setBarH(); addEventListener("resize", setBarH);
$("#theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nx = cur === "dark" ? "light" : "dark"; applyTheme(nx); store.set("theme", nx); route(true);
});
document.addEventListener("click", e => {
  if (!e.target.closest(".def")) pop.hidden = true;
  const ev = e.target.closest("[data-ev]"); if (ev) { e.stopPropagation(); toast(`출신 판정 근거: ${ev.dataset.ev}`); }
});

/* ---------- 라우팅 ---------- */
let lastHash = null;
function route(keepScroll) {
  hideTip(); pop.hidden = true;
  const h = (location.hash || "").slice(1);
  if (/^g\d+$/.test(h)) viewGroup(+h.slice(1));
  else if (/^r\d+(x\d+)*$/.test(h)) { const [r0, ...ps] = h.slice(1).split("x").map(Number); viewReport(r0, ps); }
  else if (/^m\d+$/.test(h)) viewGroupRoster(+h.slice(1));
  else if (/^c\d{8}$/.test(h)) viewCompany(h.slice(1));
  else if (/^p\d+$/.test(h)) viewPerson(+h.slice(1));
  else if (/^cmp-(comp|flow|board|edu)$/.test(h)) { homeView = h.slice(4); store.set("homeView", homeView); viewHome(); setTimeout(() => document.getElementById("hometbl")?.scrollIntoView({ block: "start" }), 40); }
  else { viewHome(); if (h === "method") setTimeout(() => document.getElementById("method")?.scrollIntoView(), 30); }
  if (!keepScroll && h !== "method" && !h.startsWith("cmp-") && h !== lastHash) {
    const back = isBack ? scrollMemo.get(h) : 0;   // 뒤로 가기로 돌아왔을 때만 보던 위치로
    setTimeout(() => window.scrollTo(0, back || 0), back ? 60 : 0);
    if (back) setTimeout(() => { if (Math.abs(scrollY - back) > 40) window.scrollTo(0, back); }, 700);   // 명단이 늦게 그려지는 화면
  }
  lastHash = h;
}
const scrollMemo = new Map();
let isBack = false; const navStack = [];
addEventListener("hashchange", e => {
  const nh = location.hash.slice(1);
  try { scrollMemo.set(new URL(e.oldURL).hash.slice(1), window.scrollY); } catch {}
  isBack = navStack.length >= 2 && navStack[navStack.length - 2] === nh;
  if (isBack) navStack.pop(); else navStack.push(nh);
  route(false);
});
fetch("data/core.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
  CORE = d;
  d.companies.forEach(c => { byId[c.id] = c; });
  d.groups.forEach(g => { byRank[g.rank] = g; byName[g.name] = g; });
  syncMine(); footer(); navStack.push(location.hash.slice(1)); route(false);
  const idle = window.requestIdleCallback || (f => setTimeout(f, 1200));
  idle(() => loadPeople().catch(() => {}));   // 첫 화면 뒤 인물 명단을 미리 받는다
}).catch(() => { app.innerHTML = `<p class="empty">데이터 파일(data/core.json)을 불러오지 못했습니다. 페이지를 새로고침해 주세요.</p>`; });
})();
</script>
</body>
</html>
